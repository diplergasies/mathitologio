name: Build Windows installer

# Τρέχει χειροκίνητα (Actions → Run workflow) ή όταν δημιουργείς tag έκδοσης (π.χ. v0.1.0).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # απαιτείται για τη δημιουργία Release σε tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle LibreOffice (για pptx/docx → PDF χωρίς εγκατεστημένο Office)
        shell: pwsh
        run: |
          # Retry: το community.chocolatey.org έχει περιστασιακά προσωρινές βλάβες/rate-limit
          # (π.χ. HTTP 499) που ρίχνουν το build. Ξαναπροσπαθούμε με backoff αντί να αποτυγχάνουμε αμέσως.
          $installed = $false
          for ($i = 1; $i -le 6; $i++) {
            Write-Host "choco install libreoffice-fresh — προσπάθεια $i/6..."
            choco install libreoffice-fresh -y --no-progress
            if (Test-Path "C:\Program Files\LibreOffice\program\soffice.exe") { $installed = $true; break }
            Write-Host "Αποτυχία (πιθανό προσωρινό πρόβλημα choco feed). Αναμονή 60s πριν την επόμενη..."
            Start-Sleep -Seconds 60
          }
          if (-not $installed) { throw "Δεν εγκαταστάθηκε το LibreOffice μετά από 6 προσπάθειες (choco feed)" }
          $src = "C:\Program Files\LibreOffice"
          New-Item -ItemType Directory -Force -Path resources\libreoffice | Out-Null
          Copy-Item "$src\*" resources\libreoffice\ -Recurse -Force
          # Ελαφρύ trimming για μικρότερο μέγεθος (ασφαλές — δεν επηρεάζει τη μετατροπή).
          foreach ($d in @("help","readmes")) {
            Remove-Item "resources\libreoffice\$d" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (!(Test-Path "resources\libreoffice\program\soffice.exe")) { throw "Αποτυχία αντιγραφής LibreOffice" }
          Write-Host "Bundled soffice:" (Resolve-Path "resources\libreoffice\program\soffice.exe").Path

      - name: Build Windows installer (.exe)
        # --publish never: μόνο build, χωρίς auto-upload (το release το κάνει το επόμενο βήμα σε tag).
        # Επειδή υπάρχει `build.publish` config, παράγονται ΚΑΙ το latest.yml ΚΑΙ το .blockmap στο
        # release/ (απαραίτητα για auto-update + differential download) — απλώς δεν ανεβαίνουν εδώ.
        run: npm run build && npx electron-builder --win --publish never

      # Σοβαρότητα ενημέρωσης από το subject του commit του tag ([major] | [silent], default silent).
      # Διαβάζεται από git (όχι github.event.head_commit, που σε push tag μπορεί να είναι κενό).
      - name: Determine update severity
        id: sev
        shell: pwsh
        run: |
          $subject = (git log -1 --pretty=%s).Trim()
          if ($subject -match '\[major\]') { $sev = '[major]' }
          elseif ($subject -match '\[silent\]') { $sev = '[silent]' }
          else { $sev = '[silent]' } # προεπιλογή: σιωπηλή
          "severity=$sev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Subject: $subject  ->  Σοβαρότητα: $sev"

      # ΣΗΜ.: Δεν ανεβάζουμε το installer ως Actions artifact (περιττό ~310 MB, γεμίζει το quota):
      # αποθηκεύεται ως GitHub Release asset ΚΑΙ στο Google Drive.

      # Σε tag (π.χ. v2.0.0) δημιουργεί ΔΗΜΟΣΙΟ GitHub Release με installer + latest.yml + blockmap.
      # Η severity μπαίνει στο body· η εφαρμογή τη διαβάζει (updater.cjs → resolveSeverity, /releases/latest).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          body: |
            Έκδοση ${{ github.ref_name }}. severity: ${{ steps.sev.outputs.severity }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ανεβάζει το installer ΚΑΤΕΥΘΕΙΑΝ στον φάκελο Google Drive (μέσω rclone),
      # ώστε να μη χρειάζεται λήψη στον υπολογιστή + επανα-ανέβασμα.
      # Αδρανές μέχρι να οριστούν τα secrets RCLONE_CONF + GDRIVE_FOLDER_ID·
      # continue-on-error ώστε τυχόν αποτυχία να ΜΗΝ ρίχνει το release.
      - name: Upload installer to Google Drive
        continue-on-error: true
        shell: pwsh
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RCLONE_CONF) -or [string]::IsNullOrWhiteSpace($env:GDRIVE_FOLDER_ID)) {
            Write-Host "Δεν έχουν οριστεί τα secrets RCLONE_CONF/GDRIVE_FOLDER_ID — παράλειψη ανεβάσματος στο Drive."
            exit 0
          }
          choco install rclone -y --no-progress
          $conf = Join-Path $env:APPDATA "rclone\rclone.conf"
          New-Item -ItemType Directory -Force -Path (Split-Path $conf) | Out-Null
          Set-Content -Path $conf -Value $env:RCLONE_CONF -Encoding utf8 -NoNewline
          # Το remote στο rclone.conf πρέπει να λέγεται "gdrive". Ανεβάζει ΜΟΝΟ το installer
          # (Mathitologio-Setup-*.exe) — ΟΧΙ το win-unpacked/ με τα εσωτερικά .exe.
          rclone copy release/ "gdrive:" --drive-root-folder-id $env:GDRIVE_FOLDER_ID --include "Mathitologio-Setup-*.exe" --max-depth 1 --progress
          Write-Host "Το installer ανέβηκε στον φάκελο Drive (ID: $env:GDRIVE_FOLDER_ID)."
