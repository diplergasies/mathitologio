name: Build Windows installer (Πειραματικό — private prerelease)

# Ιδιωτικό build ΜΟΝΟ για τον προγραμματιστή: χτίζει το πειραματικό .exe και το επισυνάπτει
# σε ΙΔΙΩΤΙΚΟ prerelease (tag `exp-latest`) του private repo. Επειδή το repo είναι private,
# μόνο εσύ έχεις πρόσβαση. ΔΕΝ ανεβαίνει στο Google Drive.
#
# Γιατί release αντί για artifact: τα Actions artifacts μοιράζονται account-wide quota (500 MB)
# που γεμίζει εύκολα· τα release assets ΔΕΝ χρεώνονται σε αυτό το quota.
#
# Τρέχει αυτόματα σε κάθε push στον κλάδο `experimental` (+ workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches:
      - experimental

permissions:
  contents: write # απαιτείται για δημιουργία/ενημέρωση Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle LibreOffice (για pptx/docx → PDF χωρίς εγκατεστημένο Office)
        shell: pwsh
        run: |
          $installed = $false
          for ($i = 1; $i -le 6; $i++) {
            Write-Host "choco install libreoffice-fresh — προσπάθεια $i/6..."
            choco install libreoffice-fresh -y --no-progress
            if (Test-Path "C:\Program Files\LibreOffice\program\soffice.exe") { $installed = $true; break }
            Write-Host "Αποτυχία (πιθανό προσωρινό πρόβλημα choco feed). Αναμονή 60s..."
            Start-Sleep -Seconds 60
          }
          if (-not $installed) { throw "Δεν εγκαταστάθηκε το LibreOffice μετά από 6 προσπάθειες (choco feed)" }
          $src = "C:\Program Files\LibreOffice"
          New-Item -ItemType Directory -Force -Path resources\libreoffice | Out-Null
          Copy-Item "$src\*" resources\libreoffice\ -Recurse -Force
          foreach ($d in @("help","readmes")) {
            Remove-Item "resources\libreoffice\$d" -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (!(Test-Path "resources\libreoffice\program\soffice.exe")) { throw "Αποτυχία αντιγραφής LibreOffice" }
          Write-Host "Bundled soffice:" (Resolve-Path "resources\libreoffice\program\soffice.exe").Path

      - name: Inject update token (read-only PAT για auto-update private repo)
        shell: pwsh
        env:
          UPDATE_READ_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}
        run: |
          Set-Content -Path electron/updateToken.cjs -Value ("module.exports = '" + $env:UPDATE_READ_TOKEN + "'") -Encoding utf8
          Write-Host "Έγραψα electron/updateToken.cjs (μήκος token:" $env:UPDATE_READ_TOKEN.Length ")"

      - name: Determine update severity (από το μήνυμα του commit)
        id: sev
        shell: pwsh
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $msg = "$env:COMMIT_MSG"
          if ($msg -match '\[major\]') { $sev = '[major]' }
          elseif ($msg -match '\[silent\]') { $sev = '[silent]' }
          else { $sev = '[silent]' } # προεπιλογή: σιωπηλή
          "severity=$sev" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Σοβαρότητα ενημέρωσης: $sev"

      - name: Build Windows installer (.exe)
        run: npm run build && npx electron-builder --win --publish never

      - name: Publish private prerelease with installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exp-latest
          name: Πειραματική έκδοση (τελευταία)
          # Η ετικέτα severity διαβάζεται από την εφαρμογή (updater.cjs → resolveSeverity).
          body: |
            Ιδιωτικό build του κλάδου experimental. severity: ${{ steps.sev.outputs.severity }}
            Κατέβασε το `Mathitologio-EXP-Setup-*.exe` παρακάτω.
          prerelease: true
          make_latest: false
          files: |
            release/Mathitologio-EXP-Setup-*.exe
            release/Mathitologio-EXP-Setup-*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
